<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Free Lift — 2D Animated Reel Player</title>
<style>
  @font-face { font-family: 'Inter'; font-weight: 900; src: url('fonts/Inter-Black.otf'); }
  @font-face { font-family: 'FreeMono'; font-weight: 700; src: url('fonts/FreeMonoBold.ttf'); }
  html, body { margin: 0; background: #0c0e14; height: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { display: block; height: 96vh; width: auto; border-radius: 14px; box-shadow: 0 24px 64px rgba(0,0,0,0.75); }
  body.capture { background: #000; }
  body.capture #cv { height: 1920px; width: 1080px; border-radius: 0; box-shadow: none; }
  #play {
    position: fixed;
    font: 900 32px Inter, sans-serif;
    padding: 20px 42px;
    border: 3px solid #f2c94c;
    border-radius: 50px;
    background: #e4322b;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 12px 32px rgba(0,0,0,0.65);
  }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<button id="play" hidden>▶ PLAY REEL</button>
<script>if (location.search.includes('capture')) document.body.className = 'capture';</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
